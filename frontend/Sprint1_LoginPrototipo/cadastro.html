<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="styleCadastro.css">
</head>
<body>
    <div class="container">
        <form>
            <h2>Cadastre-se</h2>
            
            <div class="input-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" placeholder="Insira seu nome" required>
            </div>

            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Insira seu e-mail" required>
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Insira sua senha" required>
            </div>

            <button type="submit">Cadastrar</button>

            <p class="footer">
                Já tem uma conta? <a href="/login.html">Faça seu login</a>
            </p>
        </form>
    </div>
</body>
</html>

spring.application.name=ideiaspace

# Banco de dados exclusivo para testes automatizados.
# Senhas vêm de variáveis de ambiente; não há fallback.
spring.datasource.url=${SPRING_TEST_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ideiaspace_test}
spring.datasource.username=${SPRING_TEST_DATASOURCE_USERNAME:app_backend}
spring.datasource.password=${SPRING_TEST_DATASOURCE_PASSWORD}

spring.flyway.enabled=${SPRING_TEST_FLYWAY_ENABLED:true}
spring.flyway.url=${SPRING_TEST_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ideiaspace_test}
spring.flyway.user=${SPRING_TEST_FLYWAY_USER:postgres}
spring.flyway.password=${SPRING_TEST_FLYWAY_PASSWORD}
spring.flyway.schemas=public
spring.flyway.baseline-on-migrate=true

logging.level.org.flywaydb=DEBUG

# Segredos exclusivos de teste (NÃO são usados em produção; a aplicação recusa valores de exemplo).
APP_JWT_SECRET=test-jwt-secret-very-long-and-secure-for-testing-only-32bytes-min
APP_TOKEN_TTL_MINUTES=60
APP_CPF_KEY=test-cpf-key-very-secret-test-environment-only-1234
APP_CPF_HMAC_KEY=test-cpf-hmac-key-very-secret-test-environment-12
APP_CORS_ORIGINS=http://localhost:3000

# Administrador criado pelo bootstrap controlado para os testes de integração.
APP_BOOTSTRAP_ADMIN_NAME=Admin Integracao
APP_BOOTSTRAP_ADMIN_EMAIL=admin.integ@ideiaspace.com
APP_BOOTSTRAP_ADMIN_PASSWORD=admin_strong_password_123

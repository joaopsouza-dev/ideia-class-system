spring.application.name=ideiaspace

# Credenciais e segredos vêm exclusivamente de variáveis de ambiente (ver backend/.env.example).
# Não há fallback de senha: se uma variável obrigatória faltar, a aplicação não inicia.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/ideiaspace}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app_backend}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/ideiaspace}
spring.flyway.user=${SPRING_FLYWAY_USER:postgres}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD}
spring.flyway.schemas=${SPRING_FLYWAY_SCHEMAS:public}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}

logging.level.org.flywaydb=DEBUG

# --- Etapa 3: upload de materiais -------------------------------------------------------------
# Raiz do armazenamento PRIVADO (nunca servida como estático). Em Docker é o volume /app/storage.
# Limites por tipo são validados pelo backend (PDF 50 MB, vídeo 500 MB por padrão).
# O limite do multipart abaixo deve ser >= ao maior limite por tipo; o request-size cobre
# o arquivo + campos de formulário e impede o envio de vários arquivos grandes de uma vez.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${APP_UPLOAD_MAX_VIDEO_MB:500}MB
spring.servlet.multipart.max-request-size=${APP_UPLOAD_MAX_REQUEST_MB:512}MB
spring.servlet.multipart.file-size-threshold=1MB

# --- Armazenamento de arquivos ----------------------------------------------------------------
# Provedor: "local" (disco; padrão, desenvolvimento e testes) ou "firebase" (Firebase Storage / GCS).
app.storage.provider=${APP_STORAGE_PROVIDER:local}
# Firebase (somente com APP_STORAGE_PROVIDER=firebase). Veja docs/FIREBASE_SETUP.md.
#   FIREBASE_PROJECT_ID             id do projeto Firebase/GCP
#   FIREBASE_STORAGE_BUCKET         nome EXATO do bucket, conforme o Firebase Console
#   GOOGLE_APPLICATION_CREDENTIALS  caminho do JSON da conta de serviço (fora do repositório)
#   APP_STORAGE_SIGNED_URL_TTL_SECONDS  validade das URLs temporárias (30 a 3600; padrão 900)

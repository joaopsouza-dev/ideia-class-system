spring.application.name=ideiaspace

# Credenciais e segredos vêm exclusivamente de variáveis de ambiente (ver backend/.env.example).
# Não há fallback de senha: se uma variável obrigatória faltar, a aplicação não inicia.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/ideiaspace}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app_backend}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/ideiaspace}
spring.flyway.user=${SPRING_FLYWAY_USER:postgres}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD}
spring.flyway.schemas=${SPRING_FLYWAY_SCHEMAS:public}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}

logging.level.org.flywaydb=DEBUG

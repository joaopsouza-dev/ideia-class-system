spring.application.name=ideiaspace

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/porto-digital}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app_backend}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:databasejoaopedro}

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/porto-digital}
spring.flyway.user=${SPRING_FLYWAY_USER:joaopedro}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD:databasejoaopedro}
spring.flyway.schemas=${SPRING_FLYWAY_SCHEMAS:public}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}

logging.level.org.flywaydb=DEBUG
